# Lugru Deals: baut alle Programme und legt sie als GitHub-Release
# "lugru-deals-v<Version>" ab. Von dort holen update-github.ps1 (Windows)
# und update-github.sh (Linux) die neueste Version mit einem Befehl.
#
# Neue Version veröffentlichen: die Versionsnummer in lugru-deals/VERSION
# ändern und pushen (main oder claude/lugru-deals). Das Release samt Tag legt
# der Workflow selbst an; gibt es die Version schon, passiert nichts.
#
# Reihenfolge: Tests → Bauen → Release. Schlagen die Tests fehl, wird nichts
# veröffentlicht.
name: Lugru Deals Release

on:
  push:
    branches: [main, claude/lugru-deals]
    paths: ['lugru-deals/VERSION']
  workflow_dispatch:

concurrency:
  group: lugru-deals-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lugru-deals
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          echo "v=$V" >> "$GITHUB_OUTPUT"
          if gh release view "lugru-deals-v$V" >/dev/null 2>&1; then
            echo "Release lugru-deals-v$V gibt es schon — nichts zu tun."
            echo "neu=false" >> "$GITHUB_OUTPUT"
          else
            echo "neu=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.version.outputs.neu == 'true'
        with:
          go-version-file: lugru-deals/go.mod
          cache-dependency-path: lugru-deals/go.sum

      - name: Tests
        if: steps.version.outputs.neu == 'true'
        run: go test ./...

      - name: Programme bauen
        if: steps.version.outputs.neu == 'true'
        env:
          CGO_ENABLED: '0'
          V: ${{ steps.version.outputs.v }}
        run: |
          set -euo pipefail
          LD="-s -w -X github.com/trinkfreunde/lugru-deal-discord/internal/web.Version=$V"
          mkdir -p dist
          for a in amd64 arm64; do
            GOOS=linux GOARCH=$a go build -trimpath -ldflags "$LD" -o dist/lugru-deals-linux-$a ./cmd/lugru-deals
          done
          for a in amd64 arm64; do
            if [ "$a" = arm64 ]; then n=ARM64; else n=x64; fi
            rm -rf pak && mkdir -p pak/lugru-win
            cp scripts/windows/* pak/lugru-win/
            GOOS=windows GOARCH=$a go build -trimpath -ldflags "$LD" -o pak/lugru-win/lugru-deals.exe ./cmd/lugru-deals
            (cd pak && zip -qr "../dist/LugruDeals-Windows-$n.zip" lugru-win)
          done
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - name: Release anlegen
        if: steps.version.outputs.neu == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.v }}
        run: |
          gh release create "lugru-deals-v$V" dist/* \
            --target "$GITHUB_SHA" \
            --title "Lugru Deals $V" \
            --latest=false \
            --notes "Lugru Deals $V. Update unter Windows: update-github.cmd im Installationsordner doppelklicken. Linux: scripts/linux/update-github.sh."
