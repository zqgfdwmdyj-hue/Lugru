# Home Assistant (Green) – Grundkonfiguration. Geräte (SwitchBot, FRITZ!, Ring) werden in der
# Oberfläche unter Einstellungen → Geräte & Dienste hinzugefügt, nicht hier.
homeassistant:
  # Eigene Regeln (Benachrichtigungen, Schlösser, Heizung) liegen in packages/.
  packages: !include_dir_named packages

default_config:

# In der Oberfläche erstellte Automationen, Skripte und Szenen (nicht im Git).
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
