# Reiseplaner – läuft getrennt vom Seller-System (eigener Container, eigener Port, eigene Daten).
# Start:  cd /opt/seller-system/reiseplaner && docker compose up -d --build
# Werte in reiseplaner/.env setzen (siehe .env.example).
services:
  reiseplaner:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${REISE_PORT:-3030}:3030"
    environment:
      REISE_PASSWORT: ${REISE_PASSWORT:?REISE_PASSWORT fehlt – siehe reiseplaner/README.md}
      GYG_API_KEY: ${GYG_API_KEY:-}
      GYG_PARTNER_ID: ${GYG_PARTNER_ID:-}
    volumes:
      - reisedaten:/daten
volumes:
  reisedaten:
