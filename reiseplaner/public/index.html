<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reiseplaner</title>
  <meta name="theme-color" content="#0b5394">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="start" class="start" hidden></div>

  <header class="kopf">
    <div class="marke">⚓ Reiseplaner</div>
    <select id="reiseWahl" aria-label="Reise wählen"></select>
    <button class="knopf leise" data-aktion="reise-neu">+ Neue Reise</button>
    <span id="speicherStatus" class="status" aria-live="polite"></span>
    <button class="knopf leise weltknopf" data-aktion="ansicht" data-ziel="weltkarte" title="Meine Weltkarte (alle Reisen)" aria-label="Meine Weltkarte">🌍<span class="breit-nur"> Weltkarte</span></button>
    <button class="knopf leise ich" id="ichKnopf" data-aktion="profil" aria-label="Mein Konto">…</button>
  </header>

  <nav class="reiter" id="reiter" aria-label="Bereiche der Reise">
    <button data-gruppe="uebersicht">Übersicht</button>
    <button data-gruppe="reiseplan">Reiseplan</button>
    <button data-gruppe="vorbereitung">Vorbereitung</button>
    <button data-gruppe="unterwegs">Unterwegs</button>
    <button data-gruppe="kosten">Kosten</button>
    <button data-gruppe="erinnerungen">Erinnerungen</button>
    <span class="platz"></span>
    <button data-gruppe="verwalten" class="verwalten">⚙️ Reise verwalten</button>
    <button data-gruppe="kinder" class="kindermodus-knopf">🧒 Kindermodus</button>
  </nav>
  <nav class="unterreiter" id="unterreiter" aria-label="Unterbereiche"></nav>
  <div class="kinderleiste" id="kinderleiste" hidden><strong>🧒 Kindermodus</strong><span class="platz"></span><button class="knopf leise" data-aktion="kindermodus-ende">← Zurück<span class="breit-nur"> zur Erwachsenen-Ansicht</span></button></div>

  <main class="layout">
    <section id="inhalt" class="inhalt"></section>
    <aside class="kartenbereich">
      <div id="karte" class="karte"></div>
      <div class="legende" id="legende"></div>
    </aside>
  </main>

  <div id="kiKnopfPlatz"></div>
  <div id="kiPanelPlatz"></div>
  <dialog id="dialog" class="dialog"></dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
