# Nur wenn auf dem Server NICHTS anderes die Ports 80/443 belegt: eigener Caddy mit HTTPS für die
# Subdomain (z. B. reise.lugru.de). Läuft schon ein Webserver (z. B. der Caddy des Seller-Systems),
# diese Datei NICHT verwenden – siehe README, Abschnitt „Subdomain“.
# Start:  docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
services:
  reiseplaner:
    ports: !reset []
    expose:
      - "3030"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - reiseplaner
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${REISE_DOMAIN:?REISE_DOMAIN fehlt} --to reiseplaner:3030
    volumes:
      - caddy_daten:/data
volumes:
  caddy_daten:
